version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - nirmitee-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/nirmitee
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_SECURE=false
      - SMTP_FROM=NirmiteeRPM <noreply@nirmiteerpm.local>
      - BACKUP_DIR=/backups
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=nirmitee
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
    volumes:
      - backup-data:/backups
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - nirmitee-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nirmitee
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - backup-data:/backups
    networks:
      - nirmitee-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MailHog - Email testing server
  # SMTP: localhost:1025 | Web UI: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP server
      - "8025:8025"   # Web UI
    networks:
      - nirmitee-network
    restart: unless-stopped

networks:
  nirmitee-network:
    driver: bridge

volumes:
  postgres-data:
  backup-data:
